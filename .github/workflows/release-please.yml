name: release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode (`prepare` creates/updates release PR, `publish` creates GitHub Release)
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - publish

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ inputs.mode == 'prepare' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Release safety validation
        run: npm run release:validate

      - name: Resolve auth mode
        id: auth
        shell: bash
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PLEASE_ALLOW_GITHUB_TOKEN: ${{ vars.RELEASE_PLEASE_ALLOW_GITHUB_TOKEN }}
        run: |
          if [[ -n "${RELEASE_PLEASE_TOKEN}" ]]; then
            echo "mode=custom" >> "${GITHUB_OUTPUT}"
            echo "::notice::release-please will run with RELEASE_PLEASE_TOKEN."
          elif [[ "${RELEASE_PLEASE_ALLOW_GITHUB_TOKEN}" == "true" ]]; then
            echo "mode=github" >> "${GITHUB_OUTPUT}"
            echo "::notice::release-please will run with GITHUB_TOKEN (RELEASE_PLEASE_ALLOW_GITHUB_TOKEN=true)."
          else
            echo "mode=skip" >> "${GITHUB_OUTPUT}"
            echo "::notice::release-please skipped. Set RELEASE_PLEASE_TOKEN secret (recommended), or set RELEASE_PLEASE_ALLOW_GITHUB_TOKEN=true and enable GitHub Actions PR creation."
          fi

      - name: Run release-please (PAT)
        if: steps.auth.outputs.mode == 'custom'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
          skip-github-release: true

      - name: Run release-please (GITHUB_TOKEN fallback)
        if: steps.auth.outputs.mode == 'github'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ github.token }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
          skip-github-release: true

  build-release:
    if: ${{ inputs.mode == 'publish' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: node scripts/release/artifacts.js
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  test-release:
    needs: build-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/release
      - run: node scripts/release/smoke.js

  publish:
    needs: [build-release, test-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/release
      - run: npm ci
      - name: Verify draft uploads and publish without overwriting releases
        run: node scripts/release/publish.js
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Mark the matching release PR as published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const prs = JSON.parse(execFileSync('gh', ['pr', 'list', '--state', 'merged',
            '--label', 'autorelease: pending', '--limit', '100', '--json', 'number,mergeCommit'], { encoding: 'utf8' }));
          for (const pr of prs.filter(pr => pr.mergeCommit?.oid === process.env.GITHUB_SHA)) {
            execFileSync('gh', ['pr', 'edit', String(pr.number), '--remove-label',
              'autorelease: pending', '--add-label', 'autorelease: tagged'], { stdio: 'inherit' });
          }
          NODE

      - name: Advance verified stable downloads
        run: node scripts/release/promote.js
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Open stable documentation update
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          branch: release/stable-downloads
          commit-message: 'docs(install): advance verified stable downloads'
          title: 'docs(install): advance verified stable downloads'
          body: 'Update installation links to the published release whose CLI, starter and checksums passed public download verification.'
          add-paths: |
            scripts/release/stable.json
            README.md
            docs/guides/install.md
            docs/guides/cli.md
