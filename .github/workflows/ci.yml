name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  NODE_VERSION: 20

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run quality:check
        env:
          ASHFOX_COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run quality:deadcode
      - run: npm run quality:audit
      - run: npm run release:validate

  web-track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:web
      - run: npm run build:web
      - run: npm run test:web:browser -- --no-build
      - run: npm run test:web:browser -- --development

  public-site-track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:site

  blockbench-compatibility-track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:blockbench
      - run: npm run test:cov:blockbench
      - run: npm run quality:coverage
      - run: npm run build:blockbench
