name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  NODE_VERSION: 24

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run quality:check
        env:
          ASHFOX_COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: node scripts/quality/deadcode.test.js && node scripts/quality/deadcode.js
      - run: npm run quality:products
      - run: node scripts/quality/audit.js
      - run: npm run release:validate

  public-site-track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:engine-core
      - run: npm run test:cli
      - run: npm run test:site
      - run: npm run build:public
      - run: echo "ASHFOX_CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - run: npm run test:cli:capture
      - run: npm --workspace @ashfox/site run test:browser

  blockbench-compatibility-track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:blockbench
      - run: node scripts/quality/coverage.js
      - run: npm run build:blockbench

  sound-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:audio-core
      - run: npm run build:cli
      - run: node scripts/release/sound.js
